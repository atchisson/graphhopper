services:
  graphhopper:
    build: .
    container_name: graphhopper
    environment:
      - OSM_REGION=${OSM_REGION:-france}
      - JAVA_OPTS=${JAVA_OPTS:--Xmx16g}
      - DATA_DIR=/data
      - GRAPH_DIR=/data/graph-cache
      - PHOTO_MODE=${PHOTO_MODE:-any}
      - PHOTO_PROVIDERS=${PHOTO_PROVIDERS:-panoramax}

    ports:
      - "8989:8989"
      - "8990:8990"
    volumes:
      - ./data:/data
    tty: true
    restart: unless-stopped
